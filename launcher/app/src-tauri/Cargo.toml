[package]
name = "bloodborne-launcher"
version = "0.5.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Launcher for bloodborne_mac"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
